name: pages

# Publishes the demo page (app/static) to GitHub Pages. Without a server behind it, the page
# replays the recorded responses in app/static/demo/recordings.json.
on:
  push:
    branches: [main]
    paths: ["app/static/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  actions: read      # lets the deploy step find the uploaded page files
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/static
      - id: deployment
        uses: actions/deploy-pages@v5
