[project]
name = "local-llm-server"
version = "0.1.0"
description = "OpenAI-compatible local LLM inference server with streaming and concurrency control"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
]

[project.optional-dependencies]
hf = ["torch>=2.4", "transformers>=4.45", "accelerate>=0.34"]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "asgi-lifespan>=2.1", "openai>=1.40"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
